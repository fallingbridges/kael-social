<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#FFF9F2" />
    <title>Rapport — Social Skills, Daily</title>
    <script>
      // ?robo=1 → automation mode: keep rAF ticking in hidden tabs so E2E drivers can run
      if (new URLSearchParams(location.search).has('robo')) {
        window.__robo = true
        // Route short timers + rAF through a MessageChannel — unaffected by
        // hidden-tab throttling, so E2E drivers can run with the pane closed.
        const q = []
        const ch = new MessageChannel()
        ch.port1.onmessage = () => { const f = q.shift(); if (f) f() }
        const fast = (fn) => { q.push(fn); ch.port2.postMessage(0) }
        const _st = window.setTimeout.bind(window)
        window.setTimeout = (fn, ms = 0, ...a) => {
          if (typeof fn === 'function' && ms <= 3000) { fast(() => fn(...a)); return 0 }
          return _st(fn, ms, ...a)
        }
        window.requestAnimationFrame = (cb) => { fast(() => cb(performance.now())); return 0 }
        window.cancelAnimationFrame = () => {}
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
